<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>專案管理平台</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js"></script>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", "Helvetica Neue", sans-serif;
  background: #f7f8fa;
  color: #1f2937;
  padding: 20px;
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
}
.container { max-width: 1280px; margin: 0 auto; }

/* Login screen */
.login-screen {
  min-height: 80vh;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}
.login-card {
  background: white;
  padding: 40px;
  border-radius: 16px;
  border: 1px solid #e5e7eb;
  text-align: center;
  max-width: 400px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.04);
}
.login-card h1 { font-size: 24px; margin-bottom: 8px; }
.login-card p { color: #6b7280; margin-bottom: 24px; font-size: 13px; }
.btn-google {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 10px 20px;
  background: white;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
  color: #374151;
}
.btn-google:hover { background: #f9fafb; }
.btn-google svg { width: 18px; height: 18px; }

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  flex-wrap: wrap;
  gap: 12px;
}
.header h1 { font-size: 22px; font-weight: 600; color: #111827; }
.header .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.user-info {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  background: white;
  border: 1px solid #e5e7eb;
  border-radius: 20px;
  font-size: 12px;
}
.user-info img { width: 24px; height: 24px; border-radius: 50%; }

.tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 20px;
  border-bottom: 1px solid #e5e7eb;
}
.tab-btn {
  padding: 10px 18px;
  border: none;
  background: none;
  cursor: pointer;
  font-size: 14px;
  color: #6b7280;
  font-family: inherit;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  transition: all 0.15s;
  font-weight: 500;
}
.tab-btn:hover { color: #374151; }
.tab-btn.active { color: #4f46e5; border-bottom-color: #4f46e5; }

.btn {
  padding: 8px 14px;
  border: none;
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
  font-weight: 500;
  transition: all 0.15s;
  font-family: inherit;
}
.btn-primary { background: #4f46e5; color: white; }
.btn-primary:hover { background: #4338ca; }
.btn-secondary { background: white; color: #374151; border: 1px solid #d1d5db; }
.btn-secondary:hover { background: #f9fafb; }
.btn-ghost { background: transparent; color: #6b7280; padding: 4px 8px; }
.btn-ghost:hover { background: #f3f4f6; color: #111827; }
.btn-sm { padding: 4px 10px; font-size: 12px; }

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}
.stat-card {
  background: white;
  padding: 16px;
  border-radius: 10px;
  border: 1px solid #e5e7eb;
}
.stat-label { font-size: 12px; color: #6b7280; margin-bottom: 6px; }
.stat-value { font-size: 26px; font-weight: 700; color: #111827; }
.stat-value.danger { color: #dc2626; }
.stat-value.success { color: #059669; }
.stat-value.indigo { color: #4f46e5; }

.charts-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 20px;
}
.chart-card {
  background: white;
  padding: 16px;
  border-radius: 10px;
  border: 1px solid #e5e7eb;
}
.chart-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: #374151; }
.chart-wrapper { position: relative; height: 220px; }

.filter-bar {
  background: white;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #e5e7eb;
  margin-bottom: 16px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}
.filter-bar input, .filter-bar select {
  padding: 7px 10px;
  border: 1px solid #d1d5db;
  border-radius: 6px;
  font-size: 13px;
  font-family: inherit;
  background: white;
}
.filter-bar input { flex: 1; min-width: 200px; }

.project-card {
  background: white;
  border-radius: 10px;
  border: 1px solid #e5e7eb;
  margin-bottom: 12px;
  overflow: hidden;
}
.project-month-group { margin-bottom: 22px; }
.project-month-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 18px 4px 10px;
}
.project-month-title { font-size: 18px; font-weight: 700; color: #111827; }
.project-month-count {
  background: #e5e7eb;
  color: #4b5563;
  border-radius: 999px;
  padding: 2px 9px;
  font-size: 12px;
  font-weight: 700;
}
.project-header {
  padding: 14px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-left: 4px solid var(--project-color, #4f46e5);
}
.project-header:hover { background: #fafafa; }
.project-info { flex: 1; }
.project-name { font-size: 15px; font-weight: 600; color: #111827; margin-bottom: 2px; }
.project-meta { font-size: 12px; color: #6b7280; }
.project-actions { display: flex; gap: 4px; align-items: center; }
.toggle-icon {
  display: inline-block;
  width: 16px;
  text-align: center;
  color: #6b7280;
  transition: transform 0.2s;
}
.project-card.collapsed .toggle-icon { transform: rotate(-90deg); }
.project-card.collapsed .tasks-container { display: none; }

.tasks-container {
  border-top: 1px solid #f3f4f6;
  padding: 8px 16px 16px;
}
.tasks-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
.tasks-table th {
  text-align: left;
  padding: 8px 6px;
  font-size: 11px;
  font-weight: 600;
  color: #6b7280;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  border-bottom: 1px solid #e5e7eb;
}
.tasks-table td { padding: 10px 6px; border-bottom: 1px solid #f3f4f6; vertical-align: middle; }
.tasks-table tr:last-child td { border-bottom: none; }
.tasks-table tr:hover { background: #fafafa; }

.status-badge, .priority-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 500;
}
.status-todo { background: #fef3c7; color: #92400e; }
.status-doing { background: #dbeafe; color: #1e40af; }
.status-done { background: #d1fae5; color: #065f46; }
.status-active { background: #e0e7ff; color: #3730a3; }
.status-completed { background: #d1fae5; color: #065f46; }
.priority-high { background: #fee2e2; color: #991b1b; }
.priority-mid { background: #fef3c7; color: #92400e; }
.priority-low { background: #e5e7eb; color: #374151; }

.deadline-overdue { color: #dc2626; font-weight: 600; }
.deadline-soon { color: #d97706; font-weight: 500; }

.empty-state {
  background: white;
  padding: 48px 20px;
  text-align: center;
  border-radius: 10px;
  border: 2px dashed #d1d5db;
  color: #6b7280;
}
.empty-state .icon { font-size: 36px; margin-bottom: 8px; }
.empty-state .hint { font-size: 13px; margin-top: 4px; }
.empty-tasks { text-align: center; padding: 16px; color: #9ca3af; font-size: 12px; font-style: italic; }

/* Weekly tasks view */
.weekly-toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin: 6px 0 12px;
}
.weekly-title { font-size: 18px; font-weight: 700; color: #111827; }
.weekly-nav { display: flex; align-items: center; gap: 8px; }
.weekly-nav-btn {
  border: 1px solid #d1d5db;
  background: white;
  color: #374151;
  border-radius: 6px;
  padding: 7px 10px;
  font-size: 13px;
  cursor: pointer;
}
.weekly-nav-btn:hover { background: #f9fafb; }
.weekly-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(128px, 1fr));
  background: white;
  border: 1px solid #e5e7eb;
  border-radius: 8px;
  overflow: hidden;
}
.weekly-day {
  min-height: 420px;
  border-right: 1px solid #e5e7eb;
  padding: 10px 8px;
}
.weekly-day:last-child { border-right: none; }
.weekly-day-name {
  text-align: center;
  font-size: 13px;
  font-weight: 600;
  color: #9ca3af;
  margin-bottom: 10px;
}
.weekly-day-number {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  height: 28px;
  margin-bottom: 8px;
  font-size: 15px;
  font-weight: 600;
  color: #374151;
}
.weekly-day.today .weekly-day-number span {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: #ef4444;
  color: white;
}
.weekly-task-card {
  background: white;
  border: 1px solid #e5e7eb;
  border-radius: 8px;
  padding: 9px;
  margin-bottom: 8px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  cursor: pointer;
}
.weekly-task-card:hover { border-color: #c7d2fe; box-shadow: 0 2px 6px rgba(79,70,229,0.12); }
.weekly-task-title {
  font-size: 13px;
  font-weight: 700;
  color: #111827;
  line-height: 1.35;
  margin-bottom: 8px;
  word-break: break-word;
}
.weekly-task-owner, .weekly-task-date, .weekly-task-project {
  font-size: 12px;
  color: #4b5563;
  margin-top: 5px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.weekly-task-project { color: #6b7280; }
.weekly-done {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 8px;
  font-size: 12px;
  color: #374151;
}
.weekly-done-box {
  width: 14px;
  height: 14px;
  border: 1px solid #d1d5db;
  border-radius: 3px;
  background: white;
}
.weekly-task-card.done { opacity: 0.62; }
.weekly-task-card.done .weekly-task-title { text-decoration: line-through; color: #6b7280; }
.weekly-task-card.done .weekly-done-box {
  background: #10b981;
  border-color: #10b981;
  box-shadow: inset 0 0 0 3px white;
}
.weekly-empty {
  color: #d1d5db;
  font-size: 12px;
  text-align: center;
  padding-top: 16px;
}
.unscheduled-section {
  margin-top: 16px;
  background: white;
  border: 1px solid #e5e7eb;
  border-radius: 8px;
  padding: 12px;
}
.unscheduled-title { font-size: 14px; font-weight: 700; color: #374151; margin-bottom: 10px; }
.unscheduled-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; }
.view-switch {
  display: inline-flex;
  gap: 4px;
  background: #eef2f7;
  padding: 4px;
  border-radius: 12px;
}
.view-switch button {
  border: none;
  background: transparent;
  color: #64748b;
  border-radius: 9px;
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}
.view-switch button.active {
  background: #3b82f6;
  color: white;
  box-shadow: 0 1px 3px rgba(59,130,246,0.22);
}
.daily-list {
  max-width: 720px;
  margin: 0 auto;
}
.daily-list-card {
  display: grid;
  grid-template-columns: 34px 1fr 24px;
  gap: 12px;
  align-items: center;
  background: #f8fbff;
  border: 1px solid #eef2f7;
  border-radius: 8px;
  padding: 18px 16px;
  margin-bottom: 10px;
  cursor: pointer;
  box-shadow: 0 1px 2px rgba(15,23,42,0.03);
}
.daily-list-card:hover { border-color: #bfdbfe; }
.daily-check-circle {
  width: 26px;
  height: 26px;
  border: 2px solid #9ca3af;
  border-radius: 50%;
}
.daily-list-card.done { opacity: 0.62; }
.daily-list-card.done .daily-check-circle { background: #10b981; border-color: #10b981; box-shadow: inset 0 0 0 5px #f8fbff; }
.daily-list-title {
  font-size: 17px;
  font-weight: 700;
  color: #111827;
  line-height: 1.35;
}
.daily-list-card.done .daily-list-title { text-decoration: line-through; color: #6b7280; }
.daily-list-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 6px;
  font-size: 12px;
  color: #64748b;
}
.daily-list-date { color: #ef4444; font-weight: 700; }
.daily-flag { color: #cbd5e1; font-size: 22px; }
.monthly-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(112px, 1fr));
  background: white;
  border: 1px solid #e5e7eb;
  border-radius: 8px;
  overflow: hidden;
}
.monthly-cell {
  min-height: 132px;
  border-right: 1px solid #e5e7eb;
  border-bottom: 1px solid #e5e7eb;
  padding: 8px;
}
.monthly-cell:nth-child(7n) { border-right: none; }
.monthly-cell.outside { background: #f9fafb; color: #cbd5e1; }
.monthly-number {
  display: flex;
  justify-content: flex-end;
  font-size: 13px;
  font-weight: 700;
  color: #64748b;
  margin-bottom: 6px;
}
.monthly-cell.today .monthly-number span {
  display: inline-flex;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  align-items: center;
  justify-content: center;
  background: #ef4444;
  color: white;
}
.monthly-task {
  font-size: 11px;
  line-height: 1.35;
  color: #111827;
  background: #eff6ff;
  border-radius: 5px;
  padding: 4px 5px;
  margin-bottom: 4px;
  cursor: pointer;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.monthly-more { font-size: 11px; color: #94a3b8; margin-top: 4px; }
.project-pill {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 8px; border-radius: 12px;
  font-size: 11px; font-weight: 500;
  background: #f3f4f6; color: #374151;
  white-space: nowrap;
  max-width: 180px; overflow: hidden; text-overflow: ellipsis;
}
.project-pill .dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}

.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.4);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 20px;
}
.modal-overlay.active { display: flex; }
.modal {
  background: white;
  border-radius: 12px;
  width: 100%;
  max-width: 480px;
  max-height: 90vh;
  overflow-y: auto;
  padding: 24px;
}
.modal h2 { font-size: 18px; margin-bottom: 16px; color: #111827; }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 12px; font-weight: 500; color: #374151; margin-bottom: 4px; }
.form-group input, .form-group select, .form-group textarea {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid #d1d5db;
  border-radius: 6px;
  font-size: 13px;
  font-family: inherit;
}
.form-group textarea { resize: vertical; min-height: 60px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }

.toast {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #111827;
  color: white;
  padding: 10px 16px;
  border-radius: 8px;
  font-size: 13px;
  z-index: 200;
  opacity: 0;
  transform: translateY(10px);
  transition: all 0.2s;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateY(0); }

.sync-indicator {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #10b981;
  margin-right: 4px;
}
.sync-indicator.offline { background: #ef4444; }

.config-warning {
  background: #fef3c7;
  border: 1px solid #fbbf24;
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 20px;
  color: #92400e;
  font-size: 13px;
}
.config-warning code {
  background: rgba(0,0,0,0.05);
  padding: 1px 4px;
  border-radius: 3px;
  font-size: 12px;
}
.boot-fallback {
  background: white;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  padding: 24px;
  margin: 40px auto;
  max-width: 680px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.04);
}
.boot-fallback h2 { font-size: 20px; margin-bottom: 8px; color: #111827; }
.boot-fallback p { color: #4b5563; margin: 8px 0; }
.boot-fallback code {
  background: #f3f4f6;
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 13px;
}

@media (max-width: 700px) {
  .charts-row { grid-template-columns: 1fr; }
  .form-row { grid-template-columns: 1fr; }
  .tasks-table { font-size: 12px; }
  .weekly-toolbar { align-items: flex-start; flex-direction: column; }
  .weekly-grid { grid-template-columns: 1fr; }
  .monthly-grid { grid-template-columns: 1fr; }
  .monthly-cell { min-height: 96px; border-right: none; }
  .view-switch { width: 100%; }
  .view-switch button { flex: 1; }
  .weekly-day {
    min-height: 120px;
    border-right: none;
    border-bottom: 1px solid #e5e7eb;
  }
  .weekly-day:last-child { border-bottom: none; }
  .weekly-day-name { text-align: left; }
}
</style>
</head>
<body>

<div class="container">
  <!-- Login screen -->
  <div id="loginScreen" class="login-screen" style="display:none">
    <div class="login-card">
      <h1>📋 專案管理平台</h1>
      <p>請使用 Google 帳號登入</p>
      <button class="btn-google" onclick="signIn()">
        <svg viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.79 2.72v2.26h2.91c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.91-2.26c-.81.54-1.83.86-3.05.86-2.34 0-4.33-1.58-5.04-3.71H.96v2.34A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.96 10.71A5.41 5.41 0 0 1 3.68 9c0-.59.1-1.17.28-1.71V4.96H.96A9 9 0 0 0 0 9c0 1.45.35 2.82.96 4.04l3-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58A8.96 8.96 0 0 0 9 0 9 9 0 0 0 .96 4.96l3 2.34C4.67 5.16 6.66 3.58 9 3.58z"/></svg>
        使用 Google 登入
      </button>
      <div id="loginError" style="color:#dc2626;font-size:12px;margin-top:12px"></div>
    </div>
  </div>

  <!-- Config warning -->
  <div id="configWarning" class="config-warning" style="display:none">
    ⚠️ <strong>尚未設定 Firebase</strong><br>
    請編輯 <code>firebase-config.js</code> 填入你的 Firebase 設定。詳細步驟請參考 <code>README.md</code>。
  </div>

  <div id="bootFallback" class="boot-fallback">
    <h2>正在載入專案管理平台...</h2>
    <p>如果畫面停在這裡，通常是因為你用 <code>file://</code> 直接開啟檔案，瀏覽器擋住了 Firebase 模組載入。</p>
    <p>請用本機伺服器網址開啟，例如 <code>http://127.0.0.1:8125/index.html</code>。</p>
  </div>

  <!-- Main app -->
  <div id="appScreen" style="display:none">
    <div class="header">
      <div>
        <h1>📋 專案管理平台</h1>
        <div style="font-size:12px;color:#6b7280;margin-top:2px">
          <span class="sync-indicator" id="syncIndicator"></span>
          <span id="syncStatus">即時同步中</span> · 團隊共用
        </div>
      </div>
      <div class="actions">
        <div class="user-info">
          <img id="userPhoto" src="" alt="">
          <span id="userName"></span>
          <button class="btn-ghost btn-sm" onclick="signOutUser()">登出</button>
        </div>
        <button class="btn btn-primary" onclick="openProjectModal()">＋ 新增專案</button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" id="tabProjects" onclick="switchView('projects')">📋 專案視圖</button>
      <button class="tab-btn" id="tabDaily" onclick="switchView('daily')">📅 每日任務</button>
    </div>

    <!-- Projects view -->
    <div id="viewProjects">
      <div class="filter-bar">
        <input type="text" id="searchInput" placeholder="🔍 搜尋專案..." oninput="render()">
        <select id="filterProjectCategory" onchange="render()">
          <option value="active">進行中的專案</option>
          <option value="completed">已完成的專案</option>
          <option value="">全部分類</option>
        </select>
      </div>

      <div id="projectsContainer"></div>
    </div>

    <!-- Daily view -->
    <div id="viewDaily" style="display:none">
      <div class="filter-bar">
        <button class="btn btn-secondary" onclick="openDailyTaskModal()">＋ 新增任務</button>
        <div class="view-switch">
          <button id="dailyModeDay" onclick="setTaskMode('day')">每日</button>
          <button id="dailyModeWeek" onclick="setTaskMode('week')">每週</button>
          <button id="dailyModeMonth" onclick="setTaskMode('month')">每月</button>
        </div>
        <select id="dailyFilterOwner" onchange="renderDaily()" style="flex:1">
          <option value="">👥 全部負責人的任務</option>
        </select>
        <select id="dailyFilterStatus" onchange="renderDaily()">
          <option value="active">尚未完成</option>
          <option value="">含已完成</option>
          <option value="todo">只看待辦</option>
          <option value="doing">只看進行中</option>
          <option value="done">只看已完成</option>
        </select>
      </div>
      <div id="dailyContainer"></div>
    </div>
  </div>
</div>

<!-- Modals -->

<div class="modal-overlay" id="taskModal">
  <div class="modal">
    <h2 id="taskModalTitle">新增任務</h2>
    <input type="hidden" id="taskProjectId">
    <input type="hidden" id="taskId">
    <div class="form-group">
      <label>任務名稱 *</label>
      <input type="text" id="taskTitle" placeholder="例如：完成需求規格文件">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>負責人</label>
        <input type="text" id="taskOwner" placeholder="姓名" list="ownersList">
        <datalist id="ownersList"></datalist>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
  getFirestore, collection, doc, addDoc, updateDoc, deleteDoc,
  onSnapshot, query, orderBy, serverTimestamp, enableIndexedDbPersistence
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";

let app, auth, db;
document.getElementById('bootFallback').style.display = 'none';
const isConfigured = firebaseConfig &&
  firebaseConfig.apiKey &&
  firebaseConfig.apiKey !== "YOUR_API_KEY";

if (!isConfigured) {
  document.getElementById('configWarning').style.display = 'block';
} else {
  app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = getFirestore(app);
  enableIndexedDbPersistence(db).catch(()=>{});
  onAuthStateChanged(auth, user => {
    if (user) showApp(user); else showLogin();
  });
}

let state = {
  projects: [],
  tasks: [],
  collapsed: JSON.parse(localStorage.getItem('pm_collapsed') || '{}'),
  view: localStorage.getItem('pm_view') || 'projects',
  taskMode: localStorage.getItem('pm_task_mode') || 'week',
  dailyDate: null,
  weeklyStart: null,
  monthlyDate: null
};
let unsubProjects = null, unsubTasks = null;

function showLogin() {
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('appScreen').style.display = 'none';
  if (unsubProjects) unsubProjects();
  if (unsubTasks) unsubTasks();
}
function showApp(user) {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = 'block';
  document.getElementById('userPhoto').src = user.photoURL || '';
  document.getElementById('userName').textContent = user.displayName || user.email;
  switchView(state.view);
  subscribeData();
}
window.signIn = async () => {
  try {
    await signInWithPopup(auth, new GoogleAuthProvider());
  } catch(e) {
    document.getElementById('loginError').textContent = '登入失敗：' + e.message;
  }
};
window.signOutUser = () => signOut(auth);

window.switchView = (v) => {
  state.view = v;
  localStorage.setItem('pm_view', v);
  document.getElementById('tabProjects').classList.toggle('active', v === 'projects');
  document.getElementById('tabDaily').classList.toggle('active', v === 'daily');
  document.getElementById('viewProjects').style.display = v === 'projects' ? 'block' : 'none';
  document.getElementById('viewDaily').style.display = v === 'daily' ? 'block' : 'none';
  if (v === 'daily') renderDaily(); else render();
};

function subscribeData() {
  unsubProjects = onSnapshot(
    query(collection(db, 'projects'), orderBy('createdAt', 'asc')),
    snap => {
      state.projects = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      if (state.view === 'daily') renderDaily(); else render();
      setSync(true);
    },
    err => { console.error(err); setSync(false); toast('讀取專案失敗：' + err.message); }
  );
  unsubTasks = onSnapshot(
    collection(db, 'tasks'),
    snap => {
      state.tasks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      if (state.view === 'daily') renderDaily(); else render();
      setSync(true);
    },
    err => { console.error(err); setSync(false); toast('讀取任務失敗：' + err.message); }
  );
}
function setSync(ok) {
  document.getElementById('syncIndicator').classList.toggle('offline', !ok);
  document.getElementById('syncStatus').textContent = ok ? '即時同步中' : '連線中斷';
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

window.openProjectModal = (id) => {
  document.getElementById('projectId').value = id || '';
  if (id) {
    const p = state.projects.find(x => x.id === id);
    document.getElementById('projectModalTitle').textContent = '編輯專案';
    document.getElementById('projectName').value = p.name;
    document.getElementById('projectDesc').value = p.desc || '';
    document.getElementById('projectCategory').value = projectCategory(p);
    document.getElementById('projectMonth').value = projectMonthKey(p);
    document.getElementById('projectColor').value = p.color || '#4f46e5';
  } else {
    document.getElementById('projectModalTitle').textContent = '新增專案';
    document.getElementById('projectName').value = '';
    document.getElementById('projectDesc').value = '';
    document.getElementById('projectCategory').value = 'active';
    document.getElementById('projectMonth').value = currentMonthKey();
    document.getElementById('projectColor').value = '#4f46e5';
  }
  document.getElementById('projectModal').classList.add('active');
};
window.closeProjectModal = () => document.getElementById('projectModal').classList.remove('active');
window.saveProject = async () => {
  const name = document.getElementById('projectName').value.trim();
  if (!name) { alert('請輸入專案名稱'); return; }
  const id = document.getElementById('projectId').value;
  const data = {
    name,
    desc: document.getElementById('projectDesc').value.trim(),
    category: document.getElementById('projectCategory').value,
    month: document.getElementById('projectMonth').value || currentMonthKey(),
    color: document.getElementById('projectColor').value,
    updatedAt: serverTimestamp(),
    updatedBy: auth.currentUser.email
  };
  try {
    if (id) {
      await updateDoc(doc(db, 'projects', id), data);
    } else {
      data.createdAt = serverTimestamp();
      data.createdBy = auth.currentUser.email;
      await addDoc(collection(db, 'projects'), data);
    }
    closeProjectModal();
  } catch(e) { toast('儲存失敗：' + e.message); }
};
window.deleteProject = async (id) => {
  if (!confirm('確定要刪除此專案及其所有任務？')) return;
  try {
    const tasksToDelete = state.tasks.filter(t => t.projectId === id);
    await Promise.all(tasksToDelete.map(t => deleteDoc(doc(db, 'tasks', t.id))));
    await deleteDoc(doc(db, 'projects', id));
  } catch(e) { toast('刪除失敗：' + e.message); }
};
window.toggleProjectCategory = async (id) => {
  const p = state.projects.find(x => x.id === id);
  if (!p) return;
  const next = projectCategory(p) === 'completed' ? 'active' : 'completed';
  try {
    await updateDoc(doc(db, 'projects', id), {
      category: next,
      updatedAt: serverTimestamp(),
      updatedBy: auth.currentUser.email
    });
    toast(next === 'completed' ? '已移到已完成專案' : '已恢復為進行中專案');
  } catch(e) { toast('更新分類失敗：' + e.message); }
};
window.openTaskModal = (projectId, taskId) => {
  document.getElementById('taskProjectId').value = projectId;
  document.getElementById('taskId').value = taskId || '';
  refreshOwnersList();
  if (taskId) {
    const t = state.tasks.find(x => x.id === taskId);
    document.getElementById('taskModalTitle').textContent = '編輯任務';
    document.getElementById('taskTitle').value = t.title;
    document.getElementById('taskOwner').value = t.owner || '';
    document.getElementById('taskDeadline').value = t.deadline || '';
    document.getElementById('taskStatus').value = t.status || 'todo';
    document.getElementById('taskPriority').value = t.priority || 'mid';
    document.getElementById('taskDeliverable').value = t.deliverable || '';
    document.getElementById('taskNotes').value = t.notes || '';
  } else {
    document.getElementById('taskModalTitle').textContent = '新增任務';
    ['taskTitle','taskOwner','taskDeadline','taskDeliverable','taskNotes'].forEach(i => document.getElementById(i).value = '');
    document.getElementById('taskStatus').value = 'todo';
    document.getElementById('taskPriority').value = 'mid';
  }
  document.getElementById('taskModal').classList.add('active');
};
window.openDailyTaskModal = () => {
  const project = state.projects.find(p => projectCategory(p) === 'active') || state.projects[0];
  if (!project) { toast('請先新增一個專案'); return; }
  openTaskModal(project.id);
};
window.closeTaskModal = () => document.getElementById('taskModal').classList.remove('active');
window.saveTask = async () => {
  const title = document.getElementById('taskTitle').value.trim();
  if (!title) { alert('請輸入任務名稱'); return; }
  const projectId = document.getElementById('taskProjectId').value;
  const taskId = document.getElementById('taskId').value;
  const data = {
    projectId,
    title,
    owner: document.getElementById('taskOwner').value.trim(),
    deadline: document.getElementById('taskDeadline').value,
    status: document.getElementById('taskStatus').value,
    priority: document.getElementById('taskPriority').value,
    deliverable: document.getElementById('taskDeliverable').value.trim(),
    notes: document.getElementById('taskNotes').value.trim(),
    updatedAt: serverTimestamp(),
    updatedBy: auth.currentUser.email
  };
  try {
    if (taskId) {
      await updateDoc(doc(db, 'tasks', taskId), data);
    } else {
      data.createdAt = serverTimestamp();
      data.createdBy = auth.currentUser.email;
      await addDoc(collection(db, 'tasks'), data);
    }
    closeTaskModal();
  } catch(e) { toast('儲存失敗：' + e.message); }
};
window.deleteTask = async (taskId) => {
  if (!confirm('確定要刪除此任務？')) return;
  try { await deleteDoc(doc(db, 'tasks', taskId)); }
  catch(e) { toast('刪除失敗：' + e.message); }
};
window.quickToggleStatus = async (taskId) => {
  const t = state.tasks.find(x => x.id === taskId);
  const order = ['todo','doing','done'];
  const next = order[(order.indexOf(t.status) + 1) % 3];
  try {
    await updateDoc(doc(db, 'tasks', taskId), {
      status: next,
      updatedAt: serverTimestamp(),
      updatedBy: auth.currentUser.email
    });
  } catch(e) { toast('更新失敗：' + e.message); }
};
window.toggleProject = (id) => {
  state.collapsed[id] = !state.collapsed[id];
  localStorage.setItem('pm_collapsed', JSON.stringify(state.collapsed));
  document.getElementById('proj-' + id).classList.toggle('collapsed');
};

function tasksOf(projectId) { return state.tasks.filter(t => t.projectId === projectId); }
function getAllOwners() {
  return [...new Set(state.tasks.map(t => t.owner).filter(Boolean))].sort();
}
function refreshOwnersList() {
  document.getElementById('ownersList').innerHTML = getAllOwners().map(o => `<option value="${escapeHtml(o)}">`).join('');
}
function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function statusLabel(s) { return {todo:'待辦', doing:'進行中', done:'完成'}[s] || s; }
function priorityLabel(p) { return {high:'高', mid:'中', low:'低'}[p] || p; }
function projectCategory(p) { return p.category || 'active'; }
function projectCategoryLabel(category) { return category === 'completed' ? '已完成' : '進行中'; }
function currentMonthKey() {
  const now = new Date();
  return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
}
function timestampToDate(value) {
  if (!value) return null;
  if (typeof value.toDate === 'function') return value.toDate();
  if (value.seconds) return new Date(value.seconds * 1000);
  return null;
}
function projectMonthKey(p) {
  if (p.month) return p.month;
  const d = timestampToDate(p.createdAt) || timestampToDate(p.updatedAt) || new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}
function projectMonthLabel(monthKey) {
  const [year, month] = monthKey.split('-');
  return `${year} 年 ${Number(month)} 月`;
}
function isOverdue(t) {
  if (!t.deadline || t.status === 'done') return false;
  return new Date(t.deadline) < new Date(new Date().toDateString());
}
function isSoon(t) {
  if (!t.deadline || t.status === 'done') return false;
  const d = (new Date(t.deadline) - new Date()) / 86400000;
  return d >= 0 && d <= 3;
}
function dayDiff(deadlineStr) {
  if (!deadlineStr) return null;
  const dl = new Date(deadlineStr + 'T00:00:00');
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.round((dl - today) / 86400000);
}
function weekday(d) {
  return ['週日','週一','週二','週三','週四','週五','週六'][d.getDay()];
}
function formatDateShort(dateStr) {
  if (!dateStr) return '未排程';
  const d = new Date(dateStr + 'T00:00:00');
  return `${d.getMonth()+1}/${d.getDate()}`;
}
function relativeDateText(dateStr) {
  if (!dateStr) return '沒有截止日';
  const diff = dayDiff(dateStr);
  const d = new Date(dateStr + 'T00:00:00');
  if (diff === 0) return `今天 ${weekday(d)}`;
  if (diff === 1) return `明天 ${weekday(d)}`;
  if (diff === -1) return `昨天 ${weekday(d)}`;
  if (diff < 0) return `逾期 ${-diff} 天`;
  if (diff <= 7) return `${diff} 天後 ${weekday(d)}`;
  return weekday(d);
}
function dateKey(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function startOfWeek(d = new Date()) {
  const start = new Date(d);
  start.setHours(0,0,0,0);
  const offset = (start.getDay() + 6) % 7;
  start.setDate(start.getDate() - offset);
  return start;
}
function addDays(d, days) {
  const next = new Date(d);
  next.setDate(next.getDate() + days);
  return next;
}
function addMonths(d, months) {
  const next = new Date(d);
  next.setMonth(next.getMonth() + months);
  return next;
}
function formatFullDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  return `${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}/${d.getFullYear()}`;
}
function monthTitle(d) {
  return `${d.getFullYear()} 年 ${d.getMonth() + 1} 月`;
}

window.render = function() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  const fProjectCategory = document.getElementById('filterProjectCategory').value;

  const filtered = state.projects
    .filter(p => !fProjectCategory || projectCategory(p) === fProjectCategory)
    .map(p => {
      const tasks = tasksOf(p.id);
      return { ...p, tasks };
    })
    .filter(p => {
      if (!q) return true;
      const text = [p.name, p.desc].join(' ').toLowerCase();
      return text.includes(q);
    });

  const container = document.getElementById('projectsContainer');
  if (state.projects.length === 0) {
    container.innerHTML = `<div class="empty-state">
      <div class="icon">📂</div>
      <div>還沒有任何專案</div>
      <div class="hint">點擊右上角「＋ 新增專案」開始建立</div>
    </div>`;
  } else if (filtered.length === 0) {
    container.innerHTML = `<div class="empty-state">
      <div class="icon">🔍</div>
      <div>沒有符合條件的結果</div>
    </div>`;
  } else {
    container.innerHTML = renderProjectsByMonth(filtered);
  }
};

function renderProjectsByMonth(projects) {
  const groups = {};
  projects.forEach(p => {
    const key = projectMonthKey(p);
    if (!groups[key]) groups[key] = [];
    groups[key].push(p);
  });
  return Object.keys(groups)
    .sort((a, b) => b.localeCompare(a))
    .map(month => {
      const items = groups[month].sort((a, b) => (a.name || '').localeCompare(b.name || '', 'zh-Hant'));
      return `<section class="project-month-group">
        <div class="project-month-header">
          <span class="project-month-title">${projectMonthLabel(month)}</span>
          <span class="project-month-count">${items.length}</span>
        </div>
        ${items.map(p => renderProject(p)).join('')}
      </section>`;
    })
    .join('');
}

function renderProject(p) {
  const total = p.tasks.length;
  const done = p.tasks.filter(t => t.status === 'done').length;
  const overdue = p.tasks.filter(isOverdue).length;
  const collapsed = state.collapsed[p.id] ? 'collapsed' : '';
  const category = projectCategory(p);
  const categoryLabel = projectCategoryLabel(category);
  const toggleCategoryLabel = category === 'completed' ? '恢復進行中' : '移到已完成';
  return `
    <div class="project-card ${collapsed}" id="proj-${p.id}" style="--project-color:${p.color}">
      <div class="project-header">
        <div class="project-info">
          <div class="project-name">
            ${escapeHtml(p.name)}
            <span class="status-badge status-${category === 'completed' ? 'completed' : 'active'}">${categoryLabel}</span>
          </div>
          <div class="project-meta">
            ${p.desc ? escapeHtml(p.desc) + ' · ' : ''}
            共 ${total} 個任務 · 完成 ${done} ${overdue ? `· <span style="color:#dc2626">逾期 ${overdue}</span>` : ''}
          </div>
        </div>
        <div class="project-actions" onclick="event.stopPropagation()">
          <button class="btn btn-secondary btn-sm" onclick="openTaskModal('${p.id}')">＋ 任務</button>
          <button class="btn btn-ghost btn-sm" onclick="toggleProjectCategory('${p.id}')">${toggleCategoryLabel}</button>
          <button class="btn btn-ghost btn-sm" onclick="openProjectModal('${p.id}')">編輯</button>
          <button class="btn btn-ghost btn-sm" onclick="deleteProject('${p.id}')" style="color:#dc2626">刪除</button>
        </div>
      </div>
    </div>`;
}
function renderTask(projectId, t) {
  const overdueClass = isOverdue(t) ? 'deadline-overdue' : (isSoon(t) ? 'deadline-soon' : '');
  return `
    <tr>
      <td><span class="status-badge status-${t.status}" style="cursor:pointer" onclick="quickToggleStatus('${t.id}')" title="點擊切換">${statusLabel(t.status)}</span></td>
      <td>
        <div style="font-weight:500;color:#111827">${escapeHtml(t.title)}</div>
        ${t.notes ? `<div style="font-size:11px;color:#6b7280;margin-top:2px">${escapeHtml(t.notes)}</div>` : ''}
      </td>
      <td>${t.owner ? escapeHtml(t.owner) : '<span style="color:#9ca3af">—</span>'}</td>
      <td class="${overdueClass}">${t.deadline ? `${formatDateShort(t.deadline)} <span style="color:#9ca3af;font-size:11px">${relativeDateText(t.deadline)}</span>` : '<span style="color:#9ca3af">—</span>'}</td>
      <td>${t.deliverable ? escapeHtml(t.deliverable) : '<span style="color:#9ca3af">—</span>'}</td>
      <td><span class="priority-badge priority-${t.priority}">${priorityLabel(t.priority)}</span></td>
      <td>
        <button class="btn btn-ghost btn-sm" onclick="openTaskModal('${projectId}','${t.id}')">編輯</button>
        <button class="btn btn-ghost btn-sm" onclick="deleteTask('${t.id}')" style="color:#dc2626">×</button>
      </td>
    </tr>`;
}

window.shiftWeek = (days) => {
  const current = state.weeklyStart || startOfWeek();
  state.weeklyStart = addDays(current, days);
  renderDaily();
};
window.goTodayWeek = () => {
  state.weeklyStart = startOfWeek();
  renderDaily();
};
window.setTaskMode = (mode) => {
  state.taskMode = mode;
  localStorage.setItem('pm_task_mode', mode);
  renderDaily();
};
window.shiftDay = (days) => {
  const current = state.dailyDate || new Date();
  state.dailyDate = addDays(current, days);
  renderDaily();
};
window.goTodayDay = () => {
  state.dailyDate = new Date();
  renderDaily();
};
window.shiftMonth = (months) => {
  const current = state.monthlyDate || new Date();
  state.monthlyDate = addMonths(current, months);
  renderDaily();
};
window.goTodayMonth = () => {
  state.monthlyDate = new Date();
  renderDaily();
};

window.renderDaily = function() {
  document.getElementById('dailyModeDay').classList.toggle('active', state.taskMode === 'day');
  document.getElementById('dailyModeWeek').classList.toggle('active', state.taskMode === 'week');
  document.getElementById('dailyModeMonth').classList.toggle('active', state.taskMode === 'month');

  const ownerSel = document.getElementById('dailyFilterOwner');
  const cur = ownerSel.value;
  ownerSel.innerHTML = '<option value="">👥 全部負責人的任務</option>' +
    getAllOwners().map(o => `<option value="${escapeHtml(o)}">👤 ${escapeHtml(o)}</option>`).join('');
  ownerSel.value = cur;

  const fOwner = ownerSel.value;
  const fStatus = document.getElementById('dailyFilterStatus').value;

  const projectMap = {};
  state.projects.forEach(p => projectMap[p.id] = p);
  const all = state.tasks
    .map(t => ({ ...t, _project: projectMap[t.projectId] }))
    .filter(t => t._project);

  const filtered = all.filter(t => {
    if (fOwner && t.owner !== fOwner) return false;
    if (fStatus === 'active' && t.status === 'done') return false;
    if (fStatus === 'todo' && t.status !== 'todo') return false;
    if (fStatus === 'doing' && t.status !== 'doing') return false;
    if (fStatus === 'done' && t.status !== 'done') return false;
    return true;
  });

  const prioOrder = { high: 0, mid: 1, low: 2 };
  const sortTasks = (tasks) => tasks.sort((a, b) => (prioOrder[a.priority]||1) - (prioOrder[b.priority]||1) || a.title.localeCompare(b.title, 'zh-Hant'));

  const container = document.getElementById('dailyContainer');
  if (state.projects.length === 0) {
    container.innerHTML = `<div class="empty-state">
      <div class="icon">📂</div>
      <div>還沒有任何專案</div>
      <div class="hint">先建立專案與任務，這裡才會顯示每日待辦</div>
    </div>`;
    return;
  }

  if (state.taskMode === 'day') {
    renderDayMode(container, filtered, sortTasks);
    return;
  }
  if (state.taskMode === 'month') {
    renderMonthMode(container, filtered, sortTasks);
    return;
  }
  renderWeekMode(container, filtered, sortTasks);
};

function renderDayMode(container, filtered, sortTasks) {
  const selectedDate = state.dailyDate || new Date();
  state.dailyDate = selectedDate;
  const selectedKey = dateKey(selectedDate);
  const dayTasks = sortTasks(filtered.filter(t => t.deadline === selectedKey));
  const title = dayDiff(selectedKey) === 0 ? '今天' : `${formatDateShort(selectedKey)} ${weekday(selectedDate)}`;

  container.innerHTML = `
    <div class="weekly-toolbar">
      <div class="weekly-title">${title}</div>
      <div class="weekly-nav">
        <button class="weekly-nav-btn" onclick="shiftDay(-1)">‹</button>
        <button class="weekly-nav-btn" onclick="goTodayDay()">Today</button>
        <button class="weekly-nav-btn" onclick="shiftDay(1)">›</button>
      </div>
    </div>
    <div class="daily-list">
      ${dayTasks.length ? dayTasks.map(t => renderDailyListTask(t)).join('') : `<div class="empty-state"><div class="icon">✓</div><div>這天沒有任務</div></div>`}
    </div>
  `;
}

function renderWeekMode(container, filtered, sortTasks) {
  const weekStart = state.weeklyStart || startOfWeek();
  state.weeklyStart = weekStart;
  const weekDays = Array.from({ length: 7 }, (_, i) => addDays(weekStart, i));
  const weekEnd = addDays(weekStart, 6);
  const tasksByDate = Object.fromEntries(weekDays.map(d => [dateKey(d), []]));
  const unscheduled = [];

  filtered.forEach(t => {
    if (!t.deadline) { unscheduled.push(t); return; }
    if (tasksByDate[t.deadline]) tasksByDate[t.deadline].push(t);
  });
  Object.values(tasksByDate).forEach(sortTasks);
  sortTasks(unscheduled);

  const todayKey = dateKey(new Date());
  const dayNames = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const gridHtml = weekDays.map((d, i) => {
    const key = dateKey(d);
    const tasks = tasksByDate[key];
    return `<div class="weekly-day ${key === todayKey ? 'today' : ''}">
      <div class="weekly-day-name">${dayNames[i]}</div>
      <div class="weekly-day-number"><span>${d.getDate()}</span></div>
      ${tasks.length ? tasks.map(t => renderWeeklyTask(t)).join('') : '<div class="weekly-empty">沒有任務</div>'}
    </div>`;
  }).join('');

  container.innerHTML = `
    <div class="weekly-toolbar">
      <div class="weekly-title">${monthTitle(weekStart)} <span style="font-size:12px;color:#9ca3af;font-weight:500">${formatDateShort(dateKey(weekStart))} - ${formatDateShort(dateKey(weekEnd))}</span></div>
      <div class="weekly-nav">
        <button class="weekly-nav-btn" onclick="shiftWeek(-7)">‹</button>
        <button class="weekly-nav-btn" onclick="goTodayWeek()">Today</button>
        <button class="weekly-nav-btn" onclick="shiftWeek(7)">›</button>
      </div>
    </div>
    <div class="weekly-grid">${gridHtml}</div>
    ${unscheduled.length ? `<div class="unscheduled-section">
      <div class="unscheduled-title">未排程</div>
      <div class="unscheduled-grid">${unscheduled.map(t => renderWeeklyTask(t)).join('')}</div>
    </div>` : ''}
  `;
}

function renderMonthMode(container, filtered, sortTasks) {
  const monthDate = state.monthlyDate || new Date();
  state.monthlyDate = monthDate;
  const first = new Date(monthDate.getFullYear(), monthDate.getMonth(), 1);
  const gridStart = startOfWeek(first);
  const todayKey = dateKey(new Date());
  const month = monthDate.getMonth();
  const cells = Array.from({ length: 42 }, (_, i) => addDays(gridStart, i));
  const byDate = {};
  filtered.forEach(t => {
    if (!t.deadline) return;
    if (!byDate[t.deadline]) byDate[t.deadline] = [];
    byDate[t.deadline].push(t);
  });
  Object.values(byDate).forEach(sortTasks);

  const gridHtml = cells.map(d => {
    const key = dateKey(d);
    const tasks = byDate[key] || [];
    const visible = tasks.slice(0, 3);
    return `<div class="monthly-cell ${d.getMonth() === month ? '' : 'outside'} ${key === todayKey ? 'today' : ''}">
      <div class="monthly-number"><span>${d.getDate()}</span></div>
      ${visible.map(t => `<div class="monthly-task" onclick="openTaskModal('${t._project.id}','${t.id}')" title="${escapeHtml(t.title)}">${escapeHtml(t.title)}</div>`).join('')}
      ${tasks.length > 3 ? `<div class="monthly-more">+${tasks.length - 3} 更多</div>` : ''}
    </div>`;
  }).join('');

  container.innerHTML = `
    <div class="weekly-toolbar">
      <div class="weekly-title">${monthTitle(monthDate)}</div>
      <div class="weekly-nav">
        <button class="weekly-nav-btn" onclick="shiftMonth(-1)">‹</button>
        <button class="weekly-nav-btn" onclick="goTodayMonth()">Today</button>
        <button class="weekly-nav-btn" onclick="shiftMonth(1)">›</button>
      </div>
    </div>
    <div class="weekly-day-name" style="display:grid;grid-template-columns:repeat(7,1fr);gap:0;margin-bottom:6px">
      <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
    </div>
    <div class="monthly-grid">${gridHtml}</div>
  `;
}

function renderWeeklyTask(t) {
  const p = t._project;
  const ownerText = t.owner ? escapeHtml(t.owner) : '未指派';
  const done = t.status === 'done';
  return `
    <div class="weekly-task-card ${done ? 'done' : ''}" onclick="openTaskModal('${p.id}','${t.id}')">
      <div class="weekly-task-title">● ${escapeHtml(t.title)}</div>
      <div class="weekly-task-owner">${ownerText}</div>
      <div class="weekly-task-date">${t.deadline ? formatFullDate(t.deadline) : '未排程'}</div>
      <div class="weekly-task-project" title="${escapeHtml(p.name)}">${escapeHtml(p.name)}</div>
      <div class="weekly-done" onclick="event.stopPropagation();quickToggleStatus('${t.id}')">
        <span class="weekly-done-box"></span>
        <span>Done</span>
      </div>
    </div>
  `;
}

function renderDailyListTask(t) {
  const p = t._project;
  const ownerText = t.owner ? escapeHtml(t.owner) : '未指派';
  const done = t.status === 'done';
  return `
    <div class="daily-list-card ${done ? 'done' : ''}" onclick="openTaskModal('${p.id}','${t.id}')">
      <div class="daily-check-circle" onclick="event.stopPropagation();quickToggleStatus('${t.id}')" title="切換完成"></div>
      <div>
        <div class="daily-list-title">${escapeHtml(t.title)}</div>
        <div class="daily-list-meta">
          <span>${ownerText}</span>
          ${t.deadline ? `<span class="daily-list-date">${formatDateShort(t.deadline)}</span>` : ''}
          <span>${escapeHtml(p.name)}</span>
          ${t.deliverable ? `<span>${escapeHtml(t.deliverable)}</span>` : ''}
        </div>
      </div>
      <div class="daily-flag">⚐</div>
    </div>
  `;
}

let statusChart, ownerChart;
function renderCharts(all) {
  const counts = { todo: 0, doing: 0, done: 0 };
  all.forEach(t => counts[t.status] = (counts[t.status]||0) + 1);
  const sCtx = document.getElementById('statusChart').getContext('2d');
  const sData = {
    labels: ['待辦', '進行中', '完成'],
    datasets: [{ data: [counts.todo, counts.doing, counts.done], backgroundColor: ['#fbbf24', '#60a5fa', '#34d399'], borderWidth: 0 }]
  };
  if (statusChart) { statusChart.data = sData; statusChart.update(); }
  else statusChart = new Chart(sCtx, { type:'doughnut', data:sData, options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'right', labels:{ font:{ size:12 } } } } } });

  const ownerCounts = {};
  all.forEach(t => {
    const o = t.owner || '未指派';
    if (!ownerCounts[o]) ownerCounts[o] = { todo:0, doing:0, done:0 };
    ownerCounts[o][t.status]++;
  });
  const owners = Object.keys(ownerCounts);
  const oCtx = document.getElementById('ownerChart').getContext('2d');
  const oData = {
    labels: owners,
    datasets: [
      { label:'待辦', data: owners.map(o => ownerCounts[o].todo), backgroundColor:'#fbbf24' },
      { label:'進行中', data: owners.map(o => ownerCounts[o].doing), backgroundColor:'#60a5fa' },
      { label:'完成', data: owners.map(o => ownerCounts[o].done), backgroundColor:'#34d399' }
    ]
  };
  if (ownerChart) { ownerChart.data = oData; ownerChart.update(); }
  else ownerChart = new Chart(oCtx, { type:'bar', data:oData, options:{ responsive:true, maintainAspectRatio:false, scales:{ x:{ stacked:true }, y:{ stacked:true, ticks:{ stepSize:1 } } }, plugins:{ legend:{ position:'bottom', labels:{ font:{ size:11 } } } } } });
}

document.querySelectorAll('.modal-overlay').forEach(o => {
  o.addEventListener('click', e => { if (e.target === o) o.classList.remove('active'); });
});
</script>
</body>
</html>
